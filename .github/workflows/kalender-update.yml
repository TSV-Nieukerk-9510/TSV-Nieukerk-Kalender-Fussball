name: TSV Kalender Update

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  update-calendars:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Abhängigkeiten installieren
        run: |
          pip install ics beautifulsoup4 lxml requests
      - name: Mannschaften ermitteln
        run: |
          export PYTHONPATH="$PYTHONPATH:$GITHUB_WORKSPACE"
          python -u scripts/discover_teams.py    
          
      - name: Kalender generieren
        run: |
          export PYTHONPATH="$PYTHONPATH:$GITHUB_WORKSPACE"
          python -u scripts/generate_calendars.py

      - name: Pull Request erstellen
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.PAT_PUSH }}
          commit-message: "Automatische Kalender-Aktualisierung"
          title: "Automatische Kalender-Aktualisierung"
          body: "Neue Kalenderdateien wurden generiert."
          branch: kalender-update
          delete-branch: true

      - name: PR-Information
        if: steps.cpr.outputs.pull-request-number
        run: |
          echo "PR Nummer: ${{ steps.cpr.outputs.pull-request-number }}"

      - name: Pull Request mergen
        if: steps.cpr.outputs.pull-request-number
        run: gh pr merge ${{ steps.cpr.outputs.pull-request-number }} --squash --delete-branch
        env:
          GH_TOKEN: ${{ secrets.PAT_PUSH }}
