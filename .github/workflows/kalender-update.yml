
name: TSV Kalender Update

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  update-calendars:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Abhängigkeiten installieren
        run: |
          pip install ics beautifulsoup4 lxml requests

      - name: Arbeitsverzeichnis setzen
        run: cd $GITHUB_WORKSPACE

      - name: Kalender generieren
        run: |
          export PYTHONPATH="$PYTHONPATH:$GITHUB_WORKSPACE"
          python scripts/generate_calendars.py

      - name: Debug-Datei hochladen
        uses: actions/upload-artifact@v4
        with: 
          name: debug-fussball
          path: debug_fussball.html    

      - name: Pull Request erstellen
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.PAT_PUSH }}
          commit-message: "Automatische Kalender-Aktualisierung"
          title: "Automatische Kalender-Aktualisierung"
          body: "Neue Kalenderdateien wurden generiert."
          branch: kalender-update

      - name: Pull Request automatisch mergen
        if: always()
        run: |
          gh pr merge kalender-update --squash --auto || echo "Kein PR zum Mergen gefunden."
        env:
          GH_TOKEN: ${{ secrets.PAT_PUSH }}
